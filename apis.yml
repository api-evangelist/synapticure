name: Synapticure
description: >-
  Synapticure is a virtual-first telehealth company delivering comprehensive,
  specialist neurology care for people living with neurodegenerative and complex
  neurological conditions, including ALS/PLS, Parkinson's, Alzheimer's, dementia,
  Huntington's, and multiple sclerosis. Founded in 2021 by ALS patient Brian
  Wallach and caregiver Sandra Abrevaya, the company integrates 24/7 access to
  neurologists, behavioral health (psychiatry and therapy), care coordination,
  genetic testing, clinical-trial navigation, and insurance support into a single
  virtual care experience available in all 50 states and covered by most
  insurance. It is accredited by The Joint Commission and maintains AICPA SOC 2
  compliance. Synapticure operates as a healthcare provider and does not publish
  a public developer program or API; this profile was surfaced as a GV portfolio
  company and enriched with real, published identity and security signals.
